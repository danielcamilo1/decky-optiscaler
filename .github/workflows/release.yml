name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and release (e.g. v0.0.1)"
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Resolve version
        id: version
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          version="${tag#v}"
          package_version=$(python3 -c 'import json;print(json.load(open("package.json"))["version"])')
          if [ "$version" != "$package_version" ]; then
            echo "::error::tag $tag does not match package.json version $package_version"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # A tag with a pre-release part - v0.0.5.1-testing, v0.1.0-rc1 - is a
          # prerelease. Without this, every build off the testing branch was
          # published as a full release and became the one Decky Loader's
          # "latest" link pointed at.
          case "$version" in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *)   echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build frontend
        run: pnpm build

      - name: Backend selftest
        run: python3 scripts/selftest.py

      # scripts/package.py mirrors the layout `decky plugin build` produces: one
      # top-level folder named after plugin.json's "name", runtime files only.
      - name: Package
        run: python3 scripts/package.py

      - name: Name the asset after the release
        id: asset
        run: |
          asset="out/Decky-OptiScaler-${{ steps.version.outputs.tag }}.zip"
          mv "out/Decky OptiScaler.zip" "$asset"
          echo "path=$asset" >> "$GITHUB_OUTPUT"

      # The release body is the CHANGELOG entry, so the releases page and the
      # repository carry the same notes.
      - name: Release notes
        run: |
          python3 scripts/changelog_section.py "${{ steps.version.outputs.version }}" > notes.md
          {
            echo
            echo "---"
            echo
            echo "### Install"
            echo
            echo "Decky Loader → gear icon → **Developer mode** → **Install Plugin from URL**, and paste:"
            echo
            echo '```'
            echo "https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag }}/$(basename '${{ steps.asset.outputs.path }}')"
            echo '```'
            echo
            echo "Or download the zip below and unpack it into \`~/homebrew/plugins/\`."
          } >> notes.md

      # Create it, or update the one that is already there.
      #
      # Every 0.0.4.x-testing release failed here, at the last step, after a
      # clean build: "a release with the same tag name already exists". Pushing
      # a tag runs this workflow, and a release created by hand for that same
      # tag - which is how those prereleases were published - means `gh release
      # create` is guaranteed to lose the race. The workflow then reported a red
      # cross over a release that had in fact shipped, which is the worst of
      # both: the failure means nothing and a real one would not be noticed.
      #
      # So: create when there is nothing there, and otherwise update the notes
      # and replace the asset. Either way the tag ends up with the artifact this
      # run built, and re-running the workflow on a tag is a repeatable
      # operation rather than a guaranteed failure.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          ASSET: ${{ steps.asset.outputs.path }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          set -euo pipefail
          flags=(--title "$TAG" --notes-file notes.md)
          # Both set explicitly: `gh release edit --latest` alone does not
          # clear an existing prerelease flag, so a tag re-run would leave a
          # full release still marked as one.
          if [ "$PRERELEASE" = "true" ]; then
            flags+=(--prerelease)
          else
            flags+=(--prerelease=false --latest)
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::release $TAG already exists - updating it"
            gh release edit "$TAG" "${flags[@]}"
            gh release upload "$TAG" "$ASSET" --clobber
          else
            gh release create "$TAG" "${flags[@]}" "$ASSET"
          fi
